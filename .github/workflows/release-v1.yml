name: Release Xdelta 1

# Publishes a source release when a v1.* tag is pushed. See RELEASING.md.
on:
  push:
    tags: [ 'v1.*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing v1.x tag to (re)build, e.g. v1.2.0'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  verify:
    name: Verify, build, and test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Check tag against source version
        id: check
        run: |
          set -euo pipefail
          tag="${TAG}"
          if ! [[ "$tag" =~ ^v1\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected a v1.x.y tag, got $tag"
            exit 1
          fi
          version="${tag#v}"
          cmake_version="$(sed -n 's/^project(xdelta VERSION \([0-9][0-9.]*\).*/\1/p' xdelta1/CMakeLists.txt)"
          if [ "$version" != "$cmake_version" ]; then
            echo "::error::Tag $tag implies $version but xdelta1/CMakeLists.txt has $cmake_version"
            exit 1
          fi
          grep -Fq "#define XDELTA_VERSION \"$version\"" xdelta1/xdelta.h || {
            echo "::error::xdelta1/xdelta.h does not contain version $version"
            exit 1
          }
          grep -Fq "static const char xdelta_version[] = \"$version\";" xdelta1/xdmain.c || {
            echo "::error::xdelta1/xdmain.c does not contain version $version"
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libglib2.0-dev zlib1g-dev

      - name: Configure and build
        working-directory: xdelta1
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      - name: Test round trip
        working-directory: xdelta1
        run: |
          set -euo pipefail
          seq 1 5000 > build/original
          cp build/original build/updated
          echo "release test" >> build/updated
          build/xdelta delta build/original build/updated build/change.xdelta
          build/xdelta patch build/change.xdelta build/original build/reconstructed
          cmp build/updated build/reconstructed

  source:
    name: Create source archive
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Package Xdelta 1 sources
        run: |
          set -euo pipefail
          version="${{ needs.verify.outputs.version }}"
          archive="xdelta-${version}.tar.gz"
          git archive \
            --format=tar.gz \
            --prefix="xdelta-${version}/" \
            --output="$archive" \
            "${TAG}:xdelta1"
          sha256sum "$archive" > "${archive}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: xdelta1-source
          path: |
            xdelta-*.tar.gz
            xdelta-*.tar.gz.sha256

  release:
    name: Publish GitHub Release
    needs: [ verify, source ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          name: xdelta1-source
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${{ needs.verify.outputs.version }}"
          gh release create "${TAG}" \
            --title "Xdelta ${version}" \
            --notes-from-tag \
            --latest=false \
            --verify-tag \
            dist/*
